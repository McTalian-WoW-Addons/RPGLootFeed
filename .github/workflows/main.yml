name: Main

on:
  push:
    branches:
      - main
      - ([0-9]+)?(.{([0-9]+),x}).x # 1.x, 1.2.x, 1.x.x

permissions: {}

jobs:
  ci:
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
    # trunk-ignore(pinact/unpinned-action)
    uses: McTalian-WoW-Addons/wow-build-tools/.github/workflows/ci.yml@83b931fdae0211618c649340d6cf90c3262ef8bf # v1
    with:
      addon-name: RPGLootFeed
      rockspec-name: rpglootfeed-1-1.rockspec
      lua-version: 5.4.4
      i18n-enabled: true
    secrets: inherit
